name: Deploy

# Runs only after CI succeeds on a push to main, or when someone starts it
# from the Actions tab on main. No pull_request trigger. Forks cannot reach
# secrets: workflow_run is limited to a push on this repository's main branch,
# and both jobs use GitHub environments whose deployment branches are main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to redeploy
        required: true
        type: choice
        options:
          - test
          - production

permissions:
  contents: read

jobs:
  test:
    name: Deploy test
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'test' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Checkout the CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.1.0
      - run: pnpm install --frozen-lockfile
      - name: Deploy to test
        env:
          DEPLOY_TARGET: test
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          MEDIA_CLEANUP_SECRET: ${{ secrets.MEDIA_CLEANUP_SECRET }}
          GMAIL_SMTP_USER: ${{ vars.GMAIL_SMTP_USER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          POST_DEPLOY_URL: ${{ vars.APP_URL }}
        run: bash scripts/deploy/deploy.sh

  production-backup:
    name: Backup production
    needs: test
    if: >-
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        needs.test.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production' &&
        github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/backup.yml
    with:
      git_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  production:
    name: Deploy production
    needs: [test, production-backup]
    if: >-
      always() &&
      needs.production-backup.result == 'success' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        needs.test.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.environment == 'production' &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout the CI commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.1.0
      - run: pnpm install --frozen-lockfile
      - name: Deploy to production
        env:
          DEPLOY_TARGET: production
          BACKUP_CONFIRMED: "1"
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          MEDIA_CLEANUP_SECRET: ${{ secrets.MEDIA_CLEANUP_SECRET }}
          GMAIL_SMTP_USER: ${{ vars.GMAIL_SMTP_USER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GMAIL_SMTP_PASS: ${{ secrets.GMAIL_SMTP_PASS }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          POST_DEPLOY_URL: ${{ vars.APP_URL }}
        run: bash scripts/deploy/deploy.sh
