name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter web test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Generate throwaway VAPID keys
        run: |
          deno run --allow-net --allow-env scripts/push-keys.ts --github-env > /tmp/vapid.env
          grep '^::add-mask::' /tmp/vapid.env
          grep '^[A-Z0-9_]*=' /tmp/vapid.env >> "$GITHUB_ENV"
      - name: Start Supabase (auth, API, Realtime, Mailpit, Edge Runtime)
        env:
          # Edge runtime runs on the Supabase Docker network; Mailpit is reachable as inbucket:8025.
          MAILPIT_URL: http://inbucket:8025
          EMAIL_TRANSPORT: mailpit
          APP_URL: http://127.0.0.1:5173
          EMAIL_FROM: Stay In Touch <no-reply@example.test>
          MEDIA_PROVIDER: supabase
          MEDIA_BUCKET: photos
          MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:54321
          MEDIA_UPLOAD_MAX_BYTES: "5242880"
          MEDIA_CLEANUP_SECRET: local-cleanup-dev
          PUSH_TRANSPORT: capture
          PUSH_SEND_SECRET: local-push-dev
          VAPID_SUBJECT: mailto:admin@example.test
          VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ env.VAPID_PRIVATE_KEY }}
        run: |
          free_ports() {
            supabase stop --no-backup || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f
            docker network prune -f || true
            for p in 54321 54322 54323 54324 54325 54326 54327; do
              sudo lsof -ti:"$p" | xargs -r sudo kill -9
              sudo fuser -k "${p}/tcp" 2>/dev/null || true
            done
            sleep 5
          }
          for attempt in 1 2 3 4 5; do
            free_ports
            if supabase start -x studio,imgproxy,logflare,vector,supavisor; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}), retrying..."
          done
          exit 1
      - name: Reset database
        run: supabase db reset
      - name: Check generated types drift
        run: |
          pnpm db:types
          git diff --exit-code web/src/lib/database.types.ts
      - name: Export local Supabase env
        run: |
          supabase status -o env | tee /tmp/supabase.env
          set -a && . /tmp/supabase.env && set +a
          echo "VITE_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          key="${ANON_KEY:-${PUBLISHABLE_KEY}}"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${key}" >> "$GITHUB_ENV"
      - run: pnpm --filter web build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: web
      - name: E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Deno fmt, lint, check, test
        working-directory: supabase/functions
        run: |
          deno fmt --check "**/*.ts" "**/deno.json"
          deno lint
          deno check "**/*.ts"
          deno test --allow-env --allow-net=127.0.0.1

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Start local Postgres
        run: |
          # supabase start can leave 54322 bound after a failed first container,
          # then the restart inside that same command cannot bind the port.
          free_ports() {
            supabase stop --no-backup || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f
            docker network prune -f || true
            for p in 54321 54322 54323 54324 54325 54326 54327; do
              sudo lsof -ti:"$p" | xargs -r sudo kill -9
              sudo fuser -k "${p}/tcp" 2>/dev/null || true
            done
            sleep 5
          }
          for attempt in 1 2 3 4 5; do
            free_ports
            if supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}), retrying..."
          done
          exit 1
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: pgTAP
        run: supabase test db
      - name: Lint
        run: supabase db lint --fail-on error
      - name: Security advisors
        run: supabase db advisors --type security --level warn --fail-on warn

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.1.0
      - name: Install shellcheck, age, and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck age
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | sudo tar -C /usr/local/bin -xz actionlint
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: shellcheck -x scripts/deploy/*.sh scripts/backup.sh scripts/restore.sh scripts/storage-check.sh
      - name: Script and Deno guards
        run: |
          bash scripts/deploy/guards_test.sh
          bash scripts/deploy/db-push_test.sh
          bash scripts/deploy/hosted-refusal_test.sh
          deno test --allow-env --allow-net=127.0.0.1 --allow-read --allow-write --allow-run scripts/bootstrap-family_test.ts scripts/post-deploy-check_test.ts
      - name: Build env is baked per environment
        run: bash scripts/deploy/check-build-env.sh
      - name: Headers and SPA fallback
        run: bash scripts/deploy/check-headers.sh
      - name: Start Supabase
        run: |
          free_ports() {
            supabase stop --no-backup || true
            docker ps -aq --filter name=supabase_ | xargs -r docker rm -f
            docker network prune -f || true
            for p in 54321 54322 54323 54324 54325 54326 54327; do
              sudo lsof -ti:"$p" | xargs -r sudo kill -9
              sudo fuser -k "${p}/tcp" 2>/dev/null || true
            done
            sleep 5
          }
          for attempt in 1 2 3 4 5; do
            free_ports
            if supabase start -x realtime,studio,imgproxy,logflare,vector,supavisor,edge-runtime; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}), retrying..."
          done
          exit 1
      - name: Reset database
        run: supabase db reset
      - name: Local deploy, bootstrap, backup drill, storage check
        run: bash scripts/deploy/ops-suite.sh
